[project]
name = "job-sniffer"
version = "0.1.0"
description = "Self-hosted Telegram bot for searching job vacancies on HH.ru"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.19.1",
    "playwright>=1.62.0",
    "beautifulsoup4>=4.13.0",
    "aiohttp-socks>=0.9.1",
    "pydantic>=2.9.2,<2.11",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.21.0",
]

[project.scripts]
job-sniffer = "app.telegram.bot:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "W291"]  # генерируются Alembic

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
